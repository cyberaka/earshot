spring:
  application:
    name: earshot-api
  # The same .env the Python processes read (PRD §10.1).
  config:
    import: "optional:file:${EARSHOT_ENV_FILE:../.env}[.properties]"
  datasource:
    # Native Homebrew Postgres 17 + pgvector on 5435 (owner decision D-5, 2026-10-24: no Docker VM).
    url: ${EARSHOT_DB_URL:jdbc:postgresql://127.0.0.1:5435/earshot}
    username: ${EARSHOT_DB_USER:earshot}
    password: ${EARSHOT_DB_PASSWORD:earshot}
    hikari:
      maximum-pool-size: ${EARSHOT_DB_POOL:8}
  flyway:
    enabled: true
  servlet:
    multipart:
      # A recorder file is up to a few hours of audio; uploads stream to disk, not the heap.
      max-file-size: 2GB
      max-request-size: 4GB
      file-size-threshold: 1MB
  threads:
    virtual:
      enabled: true
  jackson:
    # Jackson 3 fails on an absent boolean by default; request bodies omit optional flags.
    deserialization:
      fail-on-null-for-primitives: false

server:
  address: 127.0.0.1
  port: ${EARSHOT_PORT:8090}
  shutdown: graceful

logging:
  level:
    com.earshot: ${EARSHOT_LOG_LEVEL:INFO}

earshot:
  data-dir: ${EARSHOT_DATA_DIR:../data}
  # The nightly backup's pg_dump: the same major version as the server.
  pg-dump: ${EARSHOT_PG_DUMP:/opt/homebrew/opt/postgresql@17/bin/pg_dump}
  # Origins allowed to send state-changing requests and open WebSockets (PRD §9.4).
  allowed-origins: ${EARSHOT_ALLOWED_ORIGINS:http://localhost:8090,http://127.0.0.1:8090,http://localhost:5173,http://127.0.0.1:5173}
  ml:
    base-url: ${EARSHOT_ML_URL:http://127.0.0.1:8091}
    capture-url: ${EARSHOT_CAPTURE_URL:http://127.0.0.1:8092}
    secret: ${EARSHOT_ML_SECRET:}
    # When true, the service starts and supervises the Python processes itself.
    manage: ${EARSHOT_ML_MANAGE:true}
    python: ${EARSHOT_ML_PYTHON:../ml/.venv/bin/python}
    workdir: ${EARSHOT_ML_WORKDIR:../ml}
  llm:
    base-url: ${EARSHOT_LLM_URL:http://127.0.0.1:1234/v1}
    timeout-seconds: ${EARSHOT_LLM_TIMEOUT_SECONDS:180}

  # Defaults for runtime settings; the Settings screen overrides them via the setting table.
  defaults:
    # Optional AI insights (owner decision 2026-10-24): each feature is off, local, openai or anthropic,
    # and runs only when the user clicks its button: no loop, nothing automatic.
    # Keys come only from the environment or .env: OPENAI_API_KEY, ANTHROPIC_API_KEY.
    insights_live_summary: "off"        # off, openai or anthropic (never local: it would share the GPU with live transcription)
    insights_meeting_summary: "off"
    insights_ask: "off"
    insights_semantic_search: "off"     # off, local or openai (Anthropic has no embeddings)
    insights_model_local: qwen2.5-7b-instruct
    insights_model_openai: gpt-4.1-mini
    insights_model_anthropic: claude-haiku-5-5
    insights_embedding_local: text-embedding-nomic-embed-text-v1.5
    insights_embedding_openai: text-embedding-3-small
    language: en+hi  # en, hi, auto, or a mix tried in order (en+hi: Hindi only when English is unsure)
    # Names and terms Whisper should spell right, comma-separated (R-3), for every recording and meeting.
    # Meetings can add their own. Tried on the 2026-10-24 class: fixed Bharat, Sajal, Zomato, Capgemini.
    vocabulary: ""
    conversation_gap_seconds: 120
    max_conversation_minutes: 90
    min_conversation_seconds: 20
    me_threshold: 0.6
    me_ambient_threshold: 0.45
    person_threshold: 0.6
    # A person is named only this far ahead of the next closest voice; closer is a near tie to confirm.
    person_margin: 0.05
    me_min_speech_seconds: 10
    diarization_threshold: 0.68
    # Live speaker separation: a voice this far (cosine distance) from everyone heard so far is a new speaker.
    # 0.60 measured on the 24 Oct class against Zoom's transcript (BUGS.md B-14): 99.0% of lines right
    # ~30 s after they are written, vs 96.9% at 0.68, which merged students into the instructor until late.
    live_speaker_threshold: 0.6
    qa_prompt_max_tokens: 3000
    live_max_segment_seconds: 15
    live_lag_warn_seconds: 60          # a banner when the transcript is this far behind the room
    recorder_filename_pattern: "(\\d{8})[_-](\\d{6})"
    raw_audio_retention_days: 30
    ambient_audio_retention_days: 30
    unknown_voiceprint_retention_days: 90
    min_free_disk_gb: 20
    backup_retention_days: 7
    no_speech_prob: 0.6
    avg_logprob: -1.0
    compression_ratio: 2.4
